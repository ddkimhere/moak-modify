name: One-time Gemini security patch

on:
  push:
    branches:
      - chore/gemini-cost-security-20260812
    paths:
      - .github/workflows/one-time-gemini-security-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/gemini-cost-security-20260812
      - name: Patch Gemini configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('yms_master_gen.py')
          text = path.read_text(encoding='utf-8')

          # Remove the committed API key without reproducing the secret value.
          text, key_count = re.subn(
              r'# 1\. API 키 설정 \(하드코딩 방식\)\s*api_key\s*=\s*["\'][^"\']+["\']\s*client\s*=\s*genai\.Client\(api_key=api_key\)',
              '# 1. API 키 설정 (Streamlit Secrets)\nif "GEMINI_API_KEY" not in st.secrets:\n    raise RuntimeError("Streamlit Secrets에 GEMINI_API_KEY를 등록해주세요.")\napi_key = str(st.secrets["GEMINI_API_KEY"]).strip()\nclient = genai.Client(api_key=api_key)',
              text,
              count=1,
              flags=re.S,
          )
          if key_count != 1:
              raise SystemExit(f'Expected one hardcoded key block, found {key_count}')

          text, model_count = re.subn(
              r"model\s*=\s*['\"]gemini-3\.5-flash['\"]",
              "model='gemini-3.1-flash-lite'",
              text,
          )
          if model_count < 1:
              raise SystemExit('Gemini model reference was not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-gemini-security-patch.yml

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yms_master_gen.py .github/workflows/one-time-gemini-security-patch.yml
          git commit -m "Secure Gemini key and switch to Flash-Lite"
          git push origin HEAD:chore/gemini-cost-security-20260812
