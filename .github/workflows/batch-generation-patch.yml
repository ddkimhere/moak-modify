name: Moak batch generation patch

on:
  push:
    branches:
      - feat/batch-question-generation-20260813
    paths:
      - .github/workflows/batch-generation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-question-generation-20260813
      - name: Patch app
        shell: bash
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Remove one-time workflow
        run: rm -f .github/workflows/batch-generation-patch.yml
      - name: Commit patched app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yms_master_gen.py .github/workflows/batch-generation-patch.yml
          git commit -m "Batch Moak question generation by passage"
          git push origin HEAD:feat/batch-question-generation-20260813
