name: Fix Moak batch syntax

on:
  push:
    branches:
      - feat/batch-question-generation-20260813
    paths:
      - .github/workflows/fix-batch-syntax.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-question-generation-20260813
      - name: Fix escaped newline and validate Python
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"
          python -m py_compile yms_master_gen.py
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-batch-syntax.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yms_master_gen.py .github/workflows/fix-batch-syntax.yml
          git commit -m "Fix batch generation syntax and validate app"
          git push origin HEAD:feat/batch-question-generation-20260813
