name: Fix answer balance import

on:
  push:
    branches:
      - feat/answer-balance-20260813
    paths:
      - .github/workflows/fix-answer-balance-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/answer-balance-20260813
      - name: Add regex import and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('yms_master_gen.py')
          text = path.read_text(encoding='utf-8')
          if 'import re\n' not in text:
              text = text.replace('import time\n', 'import time\nimport re\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile yms_master_gen.py
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/fix-answer-balance-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yms_master_gen.py .github/workflows/fix-answer-balance-import.yml || true
          git commit -m "Fix answer balance helper import" || exit 0
          git push
