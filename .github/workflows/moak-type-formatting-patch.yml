name: Moak type formatting patch

on:
  push:
    branches:
      - feat/type-formatting-20260813
    paths:
      - .github/workflows/moak-type-formatting-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/type-formatting-20260813
      - name: Patch app
        run: |
          echo '' | base64 -d > /tmp/patch_moak.py
          python /tmp/patch_moak.py
      - name: Validate app
        run: python -m py_compile yms_master_gen.py
      - name: Remove one-time workflow
        run: rm -f .github/workflows/moak-type-formatting-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yms_master_gen.py .github/workflows/moak-type-formatting-patch.yml
          git commit -m "Fix Moak type formatting and per-type difficulty"
          git push origin HEAD:feat/type-formatting-20260813
